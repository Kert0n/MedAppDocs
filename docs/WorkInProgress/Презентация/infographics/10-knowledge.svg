<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="582" viewBox="0 0 1600 582"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#102D69"/></marker></defs><rect width="1600" height="582" fill="#FFFFFF"/><rect x="30" y="20" width="750.0" height="322" rx="10" fill="#E3E8F4" stroke="#102D69" stroke-width="1.5"/><text x="58" y="64" font-family="HSE Sans, Navigo, sans-serif" font-size="26" font-weight="bold" fill="#102D69" text-anchor="start">Сервер знает</text><text x="58" y="112" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">учётная запись: идентификатор и хеш ключа</text><text x="58" y="146" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">кто состоит в общей аптечке (без имён)</text><text x="58" y="180" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">упаковки общих аптечек: название, форма, остаток</text><text x="58" y="214" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">брони каждого участника</text><text x="58" y="248" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">справочник препаратов</text><text x="58" y="282" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">ни одной даты</text><rect x="820.0" y="20" width="750.0" height="322" rx="10" fill="#DCFF05" stroke="#102D69" stroke-width="1.5"/><text x="848.0" y="64" font-family="HSE Sans, Navigo, sans-serif" font-size="26" font-weight="bold" fill="#102D69" text-anchor="start">Остаётся только на телефоне</text><text x="848.0" y="112" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">названия и места аптечек</text><text x="848.0" y="146" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">сроки годности, цены, заметки</text><text x="848.0" y="180" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">курсы, расписание, источники</text><text x="848.0" y="214" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">журнал приёмов</text><text x="848.0" y="248" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">напоминания</text><text x="848.0" y="282" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">поручения серверу</text><text x="848.0" y="316" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">местные аптечки целиком</text><text x="30" y="392" font-family="HSE Sans, Navigo, sans-serif" font-size="24" font-weight="bold" fill="#102D69" text-anchor="start">Следствия</text><rect x="30.0" y="412" width="500.0" height="150" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><text x="48.0" y="450" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="bold" fill="#102D69" text-anchor="start">Конфликт решает телефон</text><text x="48.0" y="482" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">сервер не знает курсов,</text><text x="48.0" y="509" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">бронь для него — заявка,</text><text x="48.0" y="536" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">чужую бронь стережёт клиент</text><rect x="550.0" y="412" width="500.0" height="150" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><text x="568.0" y="450" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="bold" fill="#102D69" text-anchor="start">Итог вместо событий</text><text x="568.0" y="482" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">расход приращением,</text><text x="568.0" y="509" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">бронь абсолютом —</text><text x="568.0" y="536" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">одним запросом на упаковку</text><rect x="1070.0" y="412" width="500.0" height="150" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><text x="1088.0" y="450" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="bold" fill="#102D69" text-anchor="start">Подтверждение без базы</text><text x="1088.0" y="482" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">журнал повторов в памяти</text><text x="1088.0" y="509" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">не дольше суток: таблица</text><text x="1088.0" y="536" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">копила бы частоту действий</text></svg>