<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="582" viewBox="0 0 1600 582"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#102D69"/></marker></defs><rect width="1600" height="582" fill="#FFFFFF"/><rect x="30" y="20" width="750.0" height="322" rx="10" fill="#E3E8F4" stroke="#102D69" stroke-width="1.5"/><text x="58" y="64" font-family="HSE Sans, Navigo, sans-serif" font-size="26" font-weight="bold" fill="#102D69" text-anchor="start">Сервер знает</text><text x="58" y="112" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">учётная запись: идентификатор и хеш ключа</text><text x="58" y="146" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">кто состоит в общей аптечке (без имён)</text><text x="58" y="180" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">лекарства общих аптечек: название, форма, остаток, версия</text><text x="58" y="214" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">брони каждого участника, их сумма и версия</text><text x="58" y="248" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">справочник препаратов</text><rect x="820.0" y="20" width="750.0" height="322" rx="10" fill="#DCFF05" stroke="#102D69" stroke-width="1.5"/><text x="848.0" y="64" font-family="HSE Sans, Navigo, sans-serif" font-size="26" font-weight="bold" fill="#102D69" text-anchor="start">Остаётся только на телефоне</text><text x="848.0" y="112" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">названия и места аптечек</text><text x="848.0" y="146" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">сроки годности, цены, заметки</text><text x="848.0" y="180" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">курсы, расписание, источники</text><text x="848.0" y="214" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">журнал приёмов</text><text x="848.0" y="248" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">напоминания</text><text x="848.0" y="282" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">очередь изменений для сервера</text><text x="848.0" y="316" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="normal" fill="#102D69" text-anchor="start">местные аптечки целиком</text><text x="30" y="392" font-family="HSE Sans, Navigo, sans-serif" font-size="24" font-weight="bold" fill="#102D69" text-anchor="start">Цена приватности</text><rect x="30.0" y="412" width="292.0" height="150" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><text x="48.0" y="450" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">доступ проверяется</text><text x="48.0" y="477" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">в каждом запросе:</text><text x="48.0" y="504" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">чужое и несуществующее</text><text x="48.0" y="531" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">неотличимы</text><rect x="342.0" y="412" width="292.0" height="150" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><text x="360.0" y="450" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">команда удерживает</text><text x="360.0" y="477" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">доступ до конца:</text><text x="360.0" y="504" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">участника могут</text><text x="360.0" y="531" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">исключить посреди</text><rect x="654.0" y="412" width="292.0" height="150" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><text x="672.0" y="450" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">сервер получает итоги,</text><text x="672.0" y="477" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">а не события;</text><text x="672.0" y="504" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">обновление приходит</text><text x="672.0" y="531" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">полным снимком</text><rect x="966.0" y="412" width="292.0" height="150" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><text x="984.0" y="450" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">журнал повторов</text><text x="984.0" y="477" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">только в памяти:</text><text x="984.0" y="504" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">в базе он копил бы</text><text x="984.0" y="531" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">частоту действий</text><rect x="1278.0" y="412" width="292.0" height="150" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><text x="1296.0" y="450" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">утраченный ключ</text><text x="1296.0" y="477" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">не восстановить:</text><text x="1296.0" y="504" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">сервер не знает,</text><text x="1296.0" y="531" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">чей он был</text></svg>