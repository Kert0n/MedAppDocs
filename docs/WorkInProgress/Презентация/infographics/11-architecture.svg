<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#102D69"/></marker></defs><rect width="1800" height="1060" fill="#FFFFFF"/><text x="40" y="40" font-family="HSE Sans, Navigo, sans-serif" font-size="24" font-weight="bold" fill="#102D69" text-anchor="start">Android-приложение · зависимости только внутрь</text><rect x="40" y="60" width="860" height="760" rx="28" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><text x="100" y="96" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="bold" fill="#102D69" text-anchor="start">Ведущие адаптеры: экраны (presentation, ui) и входы Android (app)</text><rect x="95" y="125" width="750" height="630" rx="28" fill="#FFFFFF" stroke="#102D69" stroke-width="1.5"/><text x="155" y="161" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="bold" fill="#102D69" text-anchor="start">Ведомые адаптеры: storage (Room) · network (Ktor) · platform (устройство)</text><rect x="160" y="195" width="620" height="490" rx="28" fill="#DFC7F2" stroke="#102D69" stroke-width="1.5"/><text x="220" y="231" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="bold" fill="#102D69" text-anchor="start">Сценарии: feature · поручения серверу: queue</text><rect x="300" y="250" width="340" height="170" rx="28" fill="#DCFF05" stroke="#102D69" stroke-width="1.5"/><text x="360" y="286" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="bold" fill="#102D69" text-anchor="start">Домен</text><text x="322" y="320" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">упаковка, аптечка, курс,</text><text x="322" y="343" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">приём, доза — и решения</text><text x="322" y="366" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">о них с причиной отказа</text><text x="230" y="480" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">IntakeConfirmation: ведёт действие</text><text x="230" y="508" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">QueueService: выдаёт поручение</text><text x="230" y="536" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">порты объявляют сами: IntakeRecords,</text><text x="230" y="564" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">Courier, Packing, Transactions</text><text x="160" y="715" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">RoomTransactions, *RoomRepository исполняют порты</text><text x="160" y="743" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">MedAppPacking собирает посылку, MedAppCourier везёт её</text><text x="70" y="805" font-family="HSE Sans, Navigo, sans-serif" font-size="17" font-weight="normal" fill="#55607A" text-anchor="start">экран проверяет только ввод; данные наблюдает через порты чтения</text><text x="1110" y="40" font-family="HSE Sans, Navigo, sans-serif" font-size="24" font-weight="bold" fill="#102D69" text-anchor="start">Сервер · слои сверху вниз</text><rect x="1110" y="70" width="520" height="70" rx="10" fill="#E3E8F4" stroke="#102D69" stroke-width="1.5"/><text x="1130" y="113" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">Контроллер: перевод HTTP, коды ответа</text><rect x="1110" y="162" width="520" height="70" rx="10" fill="#E3E8F4" stroke="#102D69" stroke-width="1.5"/><text x="1130" y="205" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">Прикладной сервис: владеет транзакцией</text><line x1="1370.0" y1="140" x2="1370.0" y2="160" stroke="#102D69" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1110" y="254" width="520" height="70" rx="10" fill="#E3E8F4" stroke="#102D69" stroke-width="1.5"/><text x="1130" y="297" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">Оркестратор: DrugSynchronisation</text><line x1="1370.0" y1="232" x2="1370.0" y2="252" stroke="#102D69" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1110" y="346" width="520" height="70" rx="10" fill="#E3E8F4" stroke="#102D69" stroke-width="1.5"/><text x="1130" y="389" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">Сервис агрегата и домен: правило</text><line x1="1370.0" y1="324" x2="1370.0" y2="344" stroke="#102D69" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1110" y="438" width="520" height="70" rx="10" fill="#E3E8F4" stroke="#102D69" stroke-width="1.5"/><text x="1130" y="481" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">Хранилище: Exposed, предикат версии</text><line x1="1370.0" y1="416" x2="1370.0" y2="436" stroke="#102D69" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1110" y="530" width="520" height="70" rx="10" fill="#FFFFFF" stroke="#102D69" stroke-width="1.5"/><text x="1130" y="573" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">PostgreSQL: общие аптечки, брони, справочник</text><line x1="1370.0" y1="508" x2="1370.0" y2="528" stroke="#102D69" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1650" y="254" width="150" height="110" rx="10" fill="#DCFF05" stroke="#102D69" stroke-width="1.5"/><text x="1664" y="290" font-family="HSE Sans, Navigo, sans-serif" font-size="17" font-weight="normal" fill="#102D69" text-anchor="start">журнал</text><text x="1664" y="314" font-family="HSE Sans, Navigo, sans-serif" font-size="17" font-weight="normal" fill="#102D69" text-anchor="start">повторов:</text><text x="1664" y="338" font-family="HSE Sans, Navigo, sans-serif" font-size="17" font-weight="normal" fill="#102D69" text-anchor="start">память, сутки</text><line x1="1630" y1="300" x2="1648" y2="300" stroke="#102D69" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="902" y1="92" x2="1106" y2="92" stroke="#102D69" stroke-width="2.2" marker-end="url(#arrow)"/><text x="930" y="78" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="bold" fill="#102D69" text-anchor="start">PUT /sync/{номер}</text><line x1="1106" y1="128" x2="904" y2="128" stroke="#102D69" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="930" y="156" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="bold" fill="#102D69" text-anchor="start">снимок пачки</text><rect x="1110" y="640" width="250" height="80" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1130" y="672" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">«Честный знак»</text><text x="1130" y="698" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">код маркировки</text><line x1="902" y1="690" x2="1106" y2="690" stroke="#102D69" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="1390" y="640" width="390" height="80" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1410" y="672" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">Сбор справочника: Python,</text><text x="1410" y="698" font-family="HSE Sans, Navigo, sans-serif" font-size="18" font-weight="normal" fill="#102D69" text-anchor="start">разово грузит в PostgreSQL</text><line x1="1560" y1="640" x2="1560" y2="626" stroke="#102D69" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="70" cy="90" r="17" fill="#102D69"/><text x="70" y="97" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="205" cy="474" r="17" fill="#102D69"/><text x="205" y="481" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="330" cy="280" r="17" fill="#102D69"/><text x="330" y="287" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="205" cy="502" r="17" fill="#102D69"/><text x="205" y="509" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><circle cx="135" cy="709" r="17" fill="#102D69"/><text x="135" y="716" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><circle cx="1090" cy="60" r="17" fill="#102D69"/><text x="1090" y="67" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><circle cx="860" cy="160" r="17" fill="#102D69"/><text x="860" y="167" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text><text x="40" y="890" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">1. Человек нажимает «Принял» у приёма из общей пачки.</text><text x="40" y="914" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">2. Экран передаёт нажатие сценарию подтверждения приёма.</text><text x="40" y="938" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">3. Домен решает, можно ли принять из этой пачки.</text><text x="40" y="962" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">4. Одной транзакцией: приём записан, выделение курса пересчитано, очередь выдала поручение.</text><text x="40" y="986" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">5. Сеть читает пачку, собирает посылку по решению очереди и везёт её на сервер.</text><text x="40" y="1010" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">6. Сервер: журнал повторов → бронь и расход одной транзакцией → запись в журнал после фиксации.</text><text x="40" y="1034" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">7. Очередь толкует ответ: снимок пачки и закрытие поручения ложатся одной транзакцией.</text></svg>