<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="444" viewBox="0 0 1600 444"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#102D69"/></marker></defs><rect width="1600" height="444" fill="#FFFFFF"/><rect x="20.0" y="20" width="296.0" height="330" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><rect x="20.0" y="20" width="296.0" height="58" rx="10" fill="#102D69" stroke="#102D69" stroke-width="1.5"/><text x="168.0" y="58" font-family="HSE Sans, Navigo, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Учёт лекарств</text><text x="40.0" y="116" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">аптечки там, где</text><text x="40.0" y="141" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">лекарства лежат:</text><text x="40.0" y="166" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">дом, дача, сумка</text><text x="40.0" y="191" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start"></text><text x="40.0" y="216" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">остаток, срок, место</text><text x="40.0" y="241" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start"></text><text x="40.0" y="266" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">ввод со справочником</text><text x="40.0" y="291" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">или сканером кода</text><rect x="336.0" y="20" width="296.0" height="330" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><rect x="336.0" y="20" width="296.0" height="58" rx="10" fill="#102D69" stroke="#102D69" stroke-width="1.5"/><text x="484.0" y="58" font-family="HSE Sans, Navigo, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Лечение</text><text x="356.0" y="116" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">курс как у врача:</text><text x="356.0" y="141" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">доза, дни, время,</text><text x="356.0" y="166" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">сколько доз выпить</text><text x="356.0" y="191" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start"></text><text x="356.0" y="216" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">источники по порядку:</text><text x="356.0" y="241" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">сначала то, что</text><text x="356.0" y="266" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">истекает раньше</text><rect x="652.0" y="20" width="296.0" height="330" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><rect x="652.0" y="20" width="296.0" height="58" rx="10" fill="#102D69" stroke="#102D69" stroke-width="1.5"/><text x="800.0" y="58" font-family="HSE Sans, Navigo, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Напоминания</text><text x="672.0" y="116" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">приходят вовремя,</text><text x="672.0" y="141" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">и после перезагрузки</text><text x="672.0" y="166" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start"></text><text x="672.0" y="191" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">ответ прямо</text><text x="672.0" y="216" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">из уведомления</text><text x="672.0" y="241" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start"></text><text x="672.0" y="266" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">«принял» списывает</text><text x="672.0" y="291" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">дозу из конкретного</text><text x="672.0" y="316" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">лекарства</text><rect x="968.0" y="20" width="296.0" height="330" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><rect x="968.0" y="20" width="296.0" height="58" rx="10" fill="#102D69" stroke="#102D69" stroke-width="1.5"/><text x="1116.0" y="58" font-family="HSE Sans, Navigo, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Общая аптечка</text><text x="988.0" y="116" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">приглашение</text><text x="988.0" y="141" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">QR или кодом</text><text x="988.0" y="166" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start"></text><text x="988.0" y="191" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">один запас на</text><text x="988.0" y="216" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">несколько телефонов</text><text x="988.0" y="241" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start"></text><text x="988.0" y="266" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">курс каждого</text><text x="988.0" y="291" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">бронирует свою часть</text><rect x="1284.0" y="20" width="296.0" height="330" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><rect x="1284.0" y="20" width="296.0" height="58" rx="10" fill="#102D69" stroke="#102D69" stroke-width="1.5"/><text x="1432.0" y="58" font-family="HSE Sans, Navigo, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Отчёты</text><text x="1304.0" y="116" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">что есть сейчас</text><text x="1304.0" y="141" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start"></text><text x="1304.0" y="166" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">сколько уйдёт</text><text x="1304.0" y="191" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">до выбранной даты</text><text x="1304.0" y="216" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start"></text><text x="1304.0" y="241" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">сколько истрачено</text><text x="1304.0" y="266" font-family="HSE Sans, Navigo, sans-serif" font-size="19" font-weight="normal" fill="#102D69" text-anchor="start">за период</text><rect x="20" y="370" width="1560" height="54" rx="10" fill="#FFFFFF" stroke="#102D69" stroke-width="1.5" stroke-dasharray="6 5"/><text x="800.0" y="405" font-family="HSE Sans, Navigo, sans-serif" font-size="21" font-weight="normal" fill="#55607A" text-anchor="middle">Не назначает лечение и не заменяет лекарства: ведёт учёт и напоминает</text></svg>