<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#102D69"/></marker></defs><rect width="1600" height="300" fill="#FFFFFF"/><line x1="30" y1="80" x2="1570" y2="80" stroke="#102D69" stroke-width="3" marker-end="url(#arrow)"/><rect x="30.0" y="110" width="243.33333333333334" height="170" rx="10" fill="#E3E8F4" stroke="#102D69" stroke-width="1.5"/><text x="46.0" y="144" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#55607A" text-anchor="start">Сервер</text><text x="46.0" y="176" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="bold" fill="#102D69" text-anchor="start">Память результатов</text><text x="46.0" y="210" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">на минуты в памяти</text><text x="46.0" y="234" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">процесса</text><rect x="289.33333333333337" y="110" width="243.33333333333334" height="170" rx="10" fill="#E3E8F4" stroke="#102D69" stroke-width="1.5"/><text x="305.33333333333337" y="144" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#55607A" text-anchor="start">Сервер</text><text x="305.33333333333337" y="176" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="bold" fill="#102D69" text-anchor="start">Запись после фиксации</text><text x="305.33333333333337" y="210" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">память помнила попытку:</text><text x="305.33333333333337" y="234" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">переживала откат</text><rect x="548.6666666666667" y="110" width="243.33333333333334" height="170" rx="10" fill="#DCFF05" stroke="#102D69" stroke-width="1.5"/><text x="564.6666666666667" y="144" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#55607A" text-anchor="start">Телефон</text><text x="564.6666666666667" y="176" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="bold" fill="#102D69" text-anchor="start">Без ручной сверки</text><text x="564.6666666666667" y="210" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">«исход неизвестен» не</text><text x="564.6666666666667" y="234" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">становится работой человека</text><rect x="808.0000000000001" y="110" width="243.33333333333334" height="170" rx="10" fill="#DCFF05" stroke="#102D69" stroke-width="1.5"/><text x="824.0000000000001" y="144" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#55607A" text-anchor="start">Телефон</text><text x="824.0000000000001" y="176" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="bold" fill="#102D69" text-anchor="start">Читать, потом писать</text><text x="824.0000000000001" y="210" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">повтор — тем же запросом</text><text x="824.0000000000001" y="234" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">и тем же номером</text><rect x="1067.3333333333335" y="110" width="243.33333333333334" height="170" rx="10" fill="#E3E8F4" stroke="#102D69" stroke-width="1.5"/><text x="1083.3333333333335" y="144" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#55607A" text-anchor="start">Сервер</text><text x="1083.3333333333335" y="176" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="bold" fill="#102D69" text-anchor="start">Разведены отказы</text><text x="1083.3333333333335" y="210" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">«устарело» и «другое тело</text><text x="1083.3333333333335" y="234" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">под тем же номером»</text><rect x="1326.666666666667" y="110" width="243.33333333333334" height="170" rx="10" fill="#F7F5FC" stroke="#102D69" stroke-width="1.5"/><text x="1342.666666666667" y="144" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#55607A" text-anchor="start">Оба</text><text x="1342.666666666667" y="176" font-family="HSE Sans, Navigo, sans-serif" font-size="20" font-weight="bold" fill="#102D69" text-anchor="start">Журнал не в базе</text><text x="1342.666666666667" y="210" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">квитанции копили бы частоту</text><text x="1342.666666666667" y="234" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">действий; сутки в памяти</text><text x="30" y="50" font-family="HSE Sans, Navigo, sans-serif" font-size="24" font-weight="bold" fill="#102D69" text-anchor="start">Как складывалась схема подтверждения операций</text></svg>