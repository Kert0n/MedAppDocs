69" text-anchor="start">вечная запись об упаковке,</text><text x="361.0" y="941" font-family="HSE Sans, Navigo, sans-serif" font-size="15" font-weight="normal" fill="#102D69" text-anchor="start">напоминания</text><rect x="950" y="615" width="620" height="72" rx="8" fill="#E3E8F4" stroke="#102D69" stroke-width="1.5"/><text x="964" y="641" font-family="Menlo, monospace" font-size="16" font-weight="bold" fill="#102D69" text-anchor="start">users</text><text x="964" y="665" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">идентификатор и хеш ключа</text><rect x="950" y="701" width="620" height="72" rx="8" fill="#E3E8F4" stroke="#102D69" stroke-width="1.5"/><text x="964" y="727" font-family="Menlo, monospace" font-size="16" font-weight="bold" fill="#102D69" text-anchor="start">user_med_kits</text><text x="964" y="751" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">членство в аптечках</text><rect x="950" y="801" width="620" height="152" rx="8" fill="#FFFFFF" stroke="#102D69" stroke-width="1.5" stroke-dasharray="5 4"/><text x="964" y="829" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="bold" fill="#102D69" text-anchor="start">На сервере нет:</text><text x="964" y="857" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">имени, почты, телефона;</text><text x="964" y="879" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">сроков годности, цен и заметок;</text><text x="964" y="901" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">курсов лечения и журнала приёмов;</text><text x="964" y="923" font-family="HSE Sans, Navigo, sans-serif" font-size="16" font-weight="normal" fill="#102D69" text-anchor="start">журналов обращений в промышленной 